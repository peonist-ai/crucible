[project]
name = "crucible-bench"
version = "0.1.0"
description = "Benchmark a served model over an OpenAI-compatible API — code, tool calling, instruction following"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Peonist AI" }]
keywords = ["llm", "benchmark", "evaluation", "humaneval", "ifeval", "bfcl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Two dependencies, both for pulling datasets. Everything that talks to a model
# is stdlib urllib on purpose — a benchmark harness is a bad place to acquire
# dependencies, and this one installs anywhere you can reach an endpoint from.
dependencies = [
    "datasets>=3.0",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
# IFEval cannot be scored without these. Three instruction types need language
# detection and two need NLTK's tokenizers; the checkers raise rather than
# treat a missing install as "instruction followed". After installing, fetch
# the tokenizer data once: python -m nltk.downloader punkt punkt_tab
ifeval = [
    "langdetect>=1.0.9",
    "nltk>=3.10.0",
]
# BFCL multi-turn is state-graded: the score is a diff of the simulated APIs'
# public attributes after the model's calls versus after ground truth's. Those
# API implementations (a file system, a trading desk, a vehicle controller)
# live in bfcl_eval; without them there is no state to compare, and the task
# raises rather than reporting anything.
# Pinned to a floor, not a range: bfcl-eval versions are dates (2026.3.23 is
# current) and the simulated APIs are the graded surface, so a version bump can
# move scores. Record the installed version alongside any number you keep.
bfcl = [
    "bfcl-eval>=2026.1.3",
]
# Only for `eval-local`, which loads a checkpoint instead of calling an
# endpoint. Pulls torch transitively — that is why it is opt-in.
local = [
    "lm-eval>=0.4",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/peonist-ai/crucible"
Repository = "https://github.com/peonist-ai/crucible"

[project.scripts]
crucible-bench = "crucible_bench.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crucible_bench*"]

# The agent-probe tasks are data, not modules — `tasks/` has no __init__.py
# because its .py files are fixtures the probed model edits, not imports.
# Without this they are silently dropped from the wheel and every task
# fails with 'missing task.md'.
[tool.setuptools.package-data]
"crucible_bench.agent_probes" = ["tasks/**/*.py", "tasks/**/*.md", "README.md"]
