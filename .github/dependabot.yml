version: 2

updates:
  # Minor and patch land as a single weekly PR. A transitive dependency under an
  # optional extra can otherwise open a run of near-identical PRs on its own.
  # Majors stay ungrouped on purpose — those want to be read individually.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
