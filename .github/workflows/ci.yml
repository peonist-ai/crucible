name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR makes the in-flight run pointless. On main, let every
# commit's run finish so the history of green/red stays complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the other's result.
      fail-fast: false
      matrix:
        # macOS is not redundant: quantize_mlx.py is the Apple-silicon path.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        # Unit tests only — they use mock models and never touch the network.
        run: uv run pytest -q

  # The one check branch protection requires. The matrix legs are named after
  # the matrix, so requiring them directly breaks the ruleset every time the
  # matrix changes; this name does not move.
  ci:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix leg to pass
        run: '[ "${{ needs.test.result }}" = "success" ] || exit 1'
